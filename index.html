<!doctype html><meta charset=utf-8><title>Genesis</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}
#t{position:fixed;inset:22% 0 auto;text-align:center;color:#fff;font:300 8vh/1 'DejaVu Serif',Georgia,serif;opacity:0;text-shadow:0 0 4vh rgba(255,200,150,.7)}
#t small{display:block;font:400 1.5vh/1 'DejaVu Sans',sans-serif;letter-spacing:.9em;text-indent:.9em;margin-top:3.5vh;opacity:.65}
</style>
<canvas></canvas><div id=t>GENESIS<small>STWORZONE WYŁĄCZNIE KODEM</small></div>
<script type=x-shader id=fs>#version 300 es
precision highp float;
uniform vec2 R;uniform float T;out vec4 O;
#define S smoothstep
float h(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float n(vec3 x){vec3 i=floor(x),f=fract(x);f*=f*(3.-2.*f);vec2 e=vec2(1,0);
 return mix(mix(mix(h(i),h(i+e.xyy),f.x),mix(h(i+e.yxy),h(i+e.xxy),f.x),f.y),
            mix(mix(h(i+e.yyx),h(i+e.xyx),f.x),mix(h(i+e.yxx),h(i+e.xxx),f.x),f.y),f.z);}
float fbm(vec3 p,int o){float s=0.,a=.5;for(int i=0;i<o;i++){s+=a*n(p);p=p*2.02+vec3(3.1,1.7,5.3);a*=.5;}return s;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
vec3 stars(vec2 p,float k){vec2 g=floor(p),f=fract(p);vec3 r=vec3(h(vec3(g,k)),h(vec3(g,k+7.)),h(vec3(g,k+13.)));
 vec2 d=f-.2-.6*r.xy;float q=dot(d,d),b=pow(r.z,14.);
 return b*(3.*exp(-q*260.)+.0012/(q+.0015))*mix(vec3(1,.7,.5),vec3(.6,.8,1),r.x);}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
 float t=T,e=t-1.,E=max(e,0.);
 uv+=(vec2(n(vec3(t*30.,1,1)),n(vec3(5,t*30.,5)))-.5)*.05*step(0.,e)*exp(-E*2.5);  // shockwave shake
 float r=length(uv),lr=log(r+1e-4);vec2 dir=uv/(r+1e-5);
 vec3 c=vec3(0);
 if(e<0.){  // singularity: matter falls inward, core pulses faster and faster
  c+=vec3(.5,.7,1)*pow(n(vec3(dir*22.,lr*5.+t*t*14.)),10.)*S(.02,.4,r)*exp(-r*3.)*t*(1.-S(.85,1.,t))*4.;
  c+=vec3(.7,.85,1)*(.3+2.*t*t*t+pow(.5+.5*sin(t*t*30.),6.)*t)*.00025/(r*r+.00004);
 }else{     // big bang: flash, chromatic shockwave, debris
  c+=vec3(1,.9,.8)*exp(-E*5.)*4.*exp(-r*2.);
  c+=vec3(1,.75,.5)*exp(-E*.8)*.002*(1.+E)/(r*r+.0004+E*.004);
  vec3 rr=1.4*sqrt(E)*vec3(1,.965,.93);
  c+=vec3(1,.85,1.3)*exp(-abs(r-rr)*(40.+E*20.))*exp(-E*1.8)*2.;
  c+=vec3(1,.6,.3)*pow(n(vec3(dir*25.,lr*2.5-E*9.)),5.)*(1.-S(rr.x-.3,rr.x+.02,r))*exp(-E*2.4)*6.;
  vec2 sp=uv*rot(t*.02);
  c+=(stars(sp*55.,1.)+stars(sp*110.,2.)*.6)*S(.3,2.,E);
 }
 float wn=S(.1,.9,E)*(1.-S(2.7,3.5,E));
 if(wn>0.)for(int i=0;i<6;i++){  // flight through the primordial nebula, stars ignite inside gas
  float fi=float(i),z=fract(fi/6.+E*.3);
  vec2 p=uv*rot(fi*1.7+E*.1)*mix(3.,.25,z)+fi*4.3;
  vec3 q=vec3(p,fi*2.3+E*.2);
  float w=fbm(q,4),d=fbm(q+vec3(w,w*.7,0)*2.2,5);
  float den=S(.4,.9,d)*S(0.,.3,z)*(1.-S(.7,1.,z));
  vec3 col=mix(mix(vec3(1,.3,.08),vec3(.9,.1,.5),w),vec3(.15,.35,1),S(.3,.7,fract(fi*.37+w*.5)));
  c+=(mix(col,vec3(1,.85,.6),exp(-E*1.5))*den*den*2.2+stars(p*25.,fi+9.)*den*3.)*wn;
 }
 float wg=S(2.5,3.3,E)*(1.-S(4.3,4.8,E));
 if(wg>0.){  // differential rotation shears gas into spiral arms, then we dive into the core
  float tg=E-2.5,form=S(0.,1.1,tg);
  vec2 p=uv*rot(-.35);p.y/=.5;
  p*=mix(.8,1.6,S(0.,1.6,tg))*mix(1.,.03,pow(S(.9,1.9,tg),2.));
  float gr=length(p);
  vec2 q=p*rot(-(tg*1.5+3.*form)/(gr+.25));
  float arm=pow(.5+.5*cos(2.*atan(q.y,q.x)),2.),d=fbm(vec3(q*3.,tg*.2),5);
  float den=d*mix(1.,arm*1.6,form)*exp(-gr*2.2),dust=S(.55,.75,fbm(vec3(q*6.,7),4))*form;
  vec3 gc=mix(vec3(.3,.5,1),vec3(1,.4,.7),S(.6,.8,d))*den*2.*(1.-dust*.7);
  gc+=vec3(1,.8,.55)*(2.*exp(-gr*gr*30.)+.006/(gr*gr+.01))+stars(q*40.,5.)*den*4.;
  c=mix(c,c*.3,wg)+gc*wg;
 }
 float wp=S(4.1,4.7,E);
 if(wp>0.){  // a molten world cools under its first sunrise
  float tp=E-4.1,pr=1.3;
  vec2 pc=vec2(0,-1.78+.3*S(0.,1.7,tp)),d=(uv-pc)/pr;
  float dl=length(d),top=pc.y+pr,px=1.5/(R.y*pr),m=1.-S(1.-px,1.+px,dl);
  vec2 sp=vec2(0,top+mix(-.05,.06,S(.5,1.6,tp))),sd=uv-sp;
  float sr=length(sd),vis=S(-.01,.03,sp.y-top);
  vec3 L=normalize(vec3((sp-pc)/pr,-1.7)),pl=vec3(0);
  if(dl<1.02){
   vec3 N=vec3(d,sqrt(max(1.-dl*dl,0.))),P=N;P.xz*=rot(tp*.15);
   float h1=fbm(P*2.2+3.,6),land=S(.5,.54,h1),dif=S(-.08,.35,dot(N,L));
   vec3 alb=mix(vec3(.02,.08,.2),mix(vec3(.25,.2,.1),vec3(.1,.25,.08),S(.55,.65,h1)),land);
   float lava=pow(1.-abs(2.*fbm(P*5.,5)-1.),10.)*(1.-.85*S(.2,1.6,tp));
   pl=alb*dif*2.+vec3(1,.3,.05)*lava*1.5*(1.-dif)+vec3(.3,.6,1)*pow(1.-N.z,4.)*(.05+1.2*dif)
     +vec3(1,.8,.6)*pow(max(dot(N,normalize(L+vec3(0,0,1))),0.),60.)*(1.-land)*2.;
  }
  float at=exp(-max(dl-1.,0.)*pr*30.)*(1.-m),tow=pow(max(dot(normalize(d),normalize(sp-pc)),0.),6.);
  vec3 atm=vec3(.3,.6,1)*at*(.15+3.*tow)+vec3(1,.5,.2)*at*tow*tow*2.;
  vec3 sun=vec3(1,.9,.75)*(.0015/(sr*sr+.00015)+.15*exp(-sr*4.))*(.4+.6*vis);
  sun+=vec3(1,.8,.6)*vis*(1.5*exp(-abs(sd.y)*120.-abs(sd.x)*1.2)+pow(abs(cos(atan(sd.y,sd.x)*4.)),60.)*exp(-sr*5.));
  c=c*(1.-m*wp)+(pl*m+atm+sun*(1.-m))*wp;
 }
 c=1.-exp(-c*1.3);
 c*=1.-.4*dot(uv,uv);
 O=vec4(pow(c,vec3(.9))+(h(vec3(gl_FragCoord.xy,t*60.))-.5)*.025,1);
}</script>
<script>
const C=document.querySelector('canvas'),g=C.getContext('webgl2',{preserveDrawingBuffer:true}),X=document.getElementById('t');
const sh=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);if(!g.getShaderParameter(o,g.COMPILE_STATUS))throw g.getShaderInfoLog(o);return o};
const P=g.createProgram();
g.attachShader(P,sh(g.VERTEX_SHADER,'#version 300 es\nvoid main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}'));
g.attachShader(P,sh(g.FRAGMENT_SHADER,document.getElementById('fs').text.trim()));
g.linkProgram(P);g.useProgram(P);
const uR=g.getUniformLocation(P,'R'),uT=g.getUniformLocation(P,'T'),S=(a,b,x)=>(x=Math.min(Math.max((x-a)/(b-a),0),1),x*x*(3-2*x));
window.draw=t=>{
 const w=C.clientWidth*devicePixelRatio|0,h=C.clientHeight*devicePixelRatio|0;
 if(C.width!=w){C.width=w;C.height=h}
 g.viewport(0,0,w,h);g.uniform2f(uR,w,h);g.uniform1f(uT,t);g.drawArrays(g.TRIANGLES,0,3);
 const k=S(6,6.7,t);X.style.opacity=k;X.style.letterSpacing=X.style.textIndent=1.1-.6*k+'em';X.style.filter=`blur(${(1-k)*12}px)`;
};
if(!navigator.webdriver){let s;const f=n=>{s??=n;draw(Math.min((n-s)/1e3%8.5,7));requestAnimationFrame(f)};requestAnimationFrame(f)}
</script>
